name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Notwendig für den GHCR-Upload

    steps:
    - name: Code auschecken
      uses: actions/checkout@v3

    - name: Java JDK 17 einrichten
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Mit Maven kompilieren und testen
      run: mvn clean package

    - name: Docker Image bauen (Lokal für Test laden)
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: devops-api-image:test

    - name: Container starten
      run: docker run -d -p 8080:8080 --name test-api devops-api-image:test

    - name: HTTP-Status prüfen (mit Retry)
      run: |
        echo "Warte auf Anwendung..."
        URL="http://localhost:8080/api/abgabedatum"
        for i in {1..10}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo "000")
          
          if [ "$STATUS" -eq 200 ]; then
            echo "Erfolg: Endpunkt liefert 200 OK."
            exit 0
          fi
          
          echo "Versuch $i: Status $STATUS. Warte 3 Sekunden..."
          sleep 3
        done
        
        echo "Fehler: Endpunkt nicht erreichbar!"
        docker logs test-api
        exit 1

    - name: An GitHub Container Registry anmelden
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker Image in Registry pushen
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/stylianos20/devops_gruppe_9/devops-api-image:latest